name: CI

# Useful with zero tests: compiles every file and imports every module, which
# catches a syntax error or a broken import before it reaches production.
# Gets stronger as tests appear — it runs them automatically once they exist.
on:
  push: { branches: [main, master] }
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Type-check if TypeScript
        # ⚠️ an `if`, NOT `[ -f x ] && cmd || echo`. That is a shell LIST, and a
        # list takes its LAST command's status -- so when `tsc` exited 2 on a real
        # type error, the `|| echo` caught it and the step exited 0, printing
        # "no tsconfig", which says the opposite of what happened. Verified
        # directly: tsc alone exit 2, the old one-liner exit 0, same error.
        # Fleet rule 5 and the exact shape `qb-ar-publish.sh` was fixed for.
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "no tsconfig — nothing to type-check"
          fi

      - name: Build if the project builds
        run: npm run build --if-present

      - name: Test if tests exist
        run: npm test --if-present
